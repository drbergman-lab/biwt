[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biwt"
version = "0.4.0"
description = "BioInformatics WalkThrough: import single-cell data and generate agent-based model initial conditions"
authors = [
    { name = "Daniel Bergman", email = "dbergman1@som.umaryland.edu" },
    { name = "Daphnee Jobert", email = "djobert@som.umaryland.edu" },
    { name = "Marwa Naji", email = "mnaji2@jh.edu" },
    { name = "Jeanette Johnson", email = "jjohn450@jhmi.edu" },
    { name = "Randy Heiland", email = "heiland@iu.edu" },
    { name = "Paul Macklin", email = "macklinp@iu.edu" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
keywords = [
    "PhysiCell",
    "bioinformatics",
    "single-cell",
    "initial conditions",
    "agent-based modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Minimal hard dependencies — deliberately lean.
# Optional data formats and GUI are declared below.
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    # cell_templates.py loads the built-in TOML at import time; the stdlib
    # tomllib is only available on 3.11+, so 3.9/3.10 need the tomli backport.
    "tomli>=1.2; python_version < '3.11'",
]

# Surfaced on the PyPI project page — the entry point for host applications
# and users who reach the package before the repository.
[project.urls]
Homepage = "https://github.com/drbergman-lab/biwt"
Repository = "https://github.com/drbergman-lab/biwt"
Documentation = "https://drbergman-lab.github.io/biwt/"
Issues = "https://github.com/drbergman-lab/biwt/issues"

[project.optional-dependencies]
# pip install biwt[anndata]  — enables .h5ad import
anndata = ["anndata>=0.9"]

# pip install biwt[seurat]   — enables .rds (Seurat / SingleCellExperiment) import
seurat = ["anndata>=0.9", "anndata2ri>=1.1,<2", "rpy2>=3.5"]

# pip install biwt[gui]      — enables biwt.gui (PyQt5 walkthrough UI)
gui = ["PyQt5>=5.15", "matplotlib>=3.5"]

# pip install biwt[all]      — everything
all = ["biwt[anndata,seurat,gui]"]

# pip install biwt[docs]     — build the documentation site (mkdocs build)
# black is not a linter here — mkdocstrings uses it to format rendered signatures.
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "black>=24"]

# pip install biwt[dev]      — development / testing extras
dev = ["pytest>=7", "pytest-qt", "biwt[anndata,gui]"]
# seurat is deliberately absent here: pip cannot install R. The R-dependent
# .rds tests are covered by the separate `seurat` job in ci.yml, which builds
# the R stack from conda and installs biwt[dev,seurat] on top.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include any non-Python assets inside the package (e.g. default XML templates)
"biwt.core.parameters" = ["*.xml", "*.json", "*.toml"]
"biwt.gui" = ["icons/*.svg", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
