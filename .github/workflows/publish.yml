name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is what triggers this workflow, but pyproject.toml is what names
      # the wheel.  Nothing keeps them in step, so a tag pushed without bumping
      # the version publishes the previous release's number to PyPI — which
      # cannot be undone, since PyPI refuses to re-upload a filename.
      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME declares $tag, but pyproject.toml says $version."
            exit 1
          fi
          echo "Publishing $version as $GITHUB_REF_NAME."

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publisher

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
